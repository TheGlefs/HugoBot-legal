<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hugo Features</title>
  <style>
    body {
      background-color: #f8fafc;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 0;
    }
    .top-page-nav {
      margin-top: 1.5rem;
      text-align: center;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.25rem;
      max-width: 960px;
      padding: 0 1rem;
    }
    .top-page-nav a {
      display: inline-block;
      padding: 0.5rem 0.8rem;
      background-color: #4f46e5;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.88rem;
      line-height: 1.1;
      transition: background-color 0.2s ease-in-out;
    }
    .top-page-nav a:hover {
      background-color: #4338ca;
      text-decoration: none;
    }
    .title-container {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      justify-content: center;
    }
    h1 {
      color: #dba622; /* keep gold accent */
      font-weight: 700;
      font-size: 2.5rem;
      margin: 0;
    }
    .logo {
      width: 60px;
      height: auto;
      background-color: transparent;
      border: none;
      box-shadow: none;
      border-radius: 0;
    }
    .feature-container {
      max-width: 800px;
      width: 100%;
      margin-bottom: 2rem;
      text-align: center;
    }
    h2 {
      color: #2570df;
      font-weight: 600;
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }
    img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
      border: 4px solid #18181B;
      background-color: transparent;
      margin: 0 auto;
    }
    .back-to-top {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      width: 56px;
      height: 56px;
      border: none;
      border-radius: 999px;
      background-color: #000000;
      color: #ffffff;
      font-size: 1.8rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.28);
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 1000;
    }
    .back-to-top.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .back-to-top:hover {
      background-color: #111111;
    }
  </style>
</head>
<body>
  <nav class="top-page-nav">
    <a href="https://discord.com/oauth2/authorize?client_id=1372571549613166713" target="_blank" rel="noopener noreferrer">Invite</a>
    <a href="/commands">Commands</a>
    <a href="https://dashboard.hugobot.net/" target="_blank" rel="noopener noreferrer">Dashboard</a>
    <a href="/docs">Documentation</a>
    <a href="/terms">Terms of Service</a>
    <a href="/privacy">Privacy Policy</a>
    <a href="https://discord.gg/WNZVCcjh6a" target="_blank" rel="noopener noreferrer">Support Server</a>
    <a href="https://patreon.com/HugoBot" target="_blank" rel="noopener noreferrer">Patreon</a>
  </nav>
  <div class="title-container">
    <img src="hugo.png" alt="Hugo Logo" class="logo">
    <h1>Hugo Features</h1>
  </div>
  <div class="feature-container">
    <h2>Captcha</h2>
    <img src="captcha.png" alt="Captcha showcase">
  </div>
  <div class="feature-container">
    <h2>Colors</h2>
    <img src="colors.png" alt="Colors showcase">
  </div>
  <div class="feature-container">
    <h2>Messages</h2>
    <img src="messages.png" alt="Messages showcase">
  </div>
  <div class="feature-container">
    <h2>Setup</h2>
    <img src="setup.png" alt="Setup showcase">
  </div>
  <div class="feature-container">
    <h2>Groups</h2>
    <img src="group.png" alt="Groups showcase">
  </div>
  <div class="feature-container">
    <h2>XP</h2>
    <img src="xp.png" alt="XP showcase">
  </div>
  <div class="feature-container">
    <h2>Rolekick</h2>
    <img src="rolekick.png" alt="Rolekick showcase">
  </div>
  <div class="feature-container">
    <h2>Logs</h2>
    <img src="logs.png" alt="Logs showcase">
  </div>
  <button class="back-to-top" type="button" aria-label="Back to top" title="Back to top">&#x2303;</button>
  <script>
    const backToTopButton = document.querySelector('.back-to-top');

    function updateBackToTopButton() {
      if (!backToTopButton) return;
      backToTopButton.classList.toggle('is-visible', window.scrollY > 240);
    }

    updateBackToTopButton();
    window.addEventListener('scroll', updateBackToTopButton, { passive: true });
    backToTopButton?.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
